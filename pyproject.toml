
[project]
name = "fastapi-enterprise-template"
version = "0.1.0"
description = "Production-grade FastAPI template (SQLAlchemy, Alembic, JWT, RBAC, tests)"
requires-python = ">=3.10,<4.0"
dependencies = [
  "fastapi>=0.114,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "passlib[bcrypt]>=1.7",
  "pyjwt>=2.8",
  "email-validator>=2.2",
  "ruff>=0.6",
  "black>=24.8.0",
  "isort>=5.13.2",
  "loguru>=0.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "coverage>=7.6",
  "requests>=2.32",
  "faker>=26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.isort]
profile = "black"
